<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../css/dashboard.css?v=1790360118"></head><body class="app-dashboard" style="display:block;padding:16px;overflow:auto;height:auto"><section class="resident-id-card resident-id-card--admin" data-resident-id-card>
          <div class="resident-id-card__header">
            <img src="../../assets/images/barangay-logo.png" alt="Barangay Luna seal" onerror="this.style.visibility='hidden';">
            <div>
              <span>Barangay Luna</span>
              <strong>Resident Identification Profile</strong>
            </div>
            <span class="badge badge-pending" data-resident-card-status>Pending</span>
          </div>
          <div class="resident-id-card__body">
            <div class="resident-id-card__photo" data-resident-card-photo>?</div>
            <div class="resident-id-card__info">
              <span>Resident ID</span>
              <strong data-resident-card-id>-</strong>
              <h3 data-resident-card-name>No resident selected</h3>
              <dl>
                <div><dt>Username</dt><dd data-resident-card-username>-</dd></div>
                <div><dt>Mobile</dt><dd data-resident-card-mobile>-</dd></div>
                <div><dt>Purok/Sitio</dt><dd data-resident-card-purok>-</dd></div>
                <div><dt>Household</dt><dd data-resident-card-household>-</dd></div>
                <div><dt>Birthdate / Age</dt><dd data-resident-card-birthdate>-</dd></div>
                <div><dt>Gender</dt><dd data-resident-card-gender>-</dd></div>
                <div><dt>Civil Status</dt><dd data-resident-card-civil-status>-</dd></div>
                <div><dt>Verification</dt><dd data-resident-card-verification>-</dd></div>
                <div><dt>Registered</dt><dd data-resident-card-registered>-</dd></div>
                <div class="resident-id-card__address-row"><dt>Address</dt><dd data-resident-card-address>-</dd></div>
              </dl>
            </div>
            <div class="resident-id-card__qr" data-resident-card-qr>
              <div class="resident-id-card__qr-empty">QR</div>
              <span data-resident-card-qr-code>-</span>
            </div>
          </div>
        </section></body></html>
