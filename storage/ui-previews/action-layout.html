<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../css/dashboard.css"><link rel="stylesheet" href="../../css/mobile-select.css"><style>body.app-dashboard{display:block;height:auto;overflow:auto;padding:16px}.previews{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px}h2{font-size:16px}section{min-width:0}</style></head><body class="app-dashboard"><main class="previews"><section><h2>Document requests</h2><table class="data-table" style="min-width:0;width:100%;background:white"><tbody><tr><td class="request-action-cell"><div class="record-action-list">

            <details><summary>Reject</summary>
              <form action="staff-actions.php" method="post" class="table-edit-form">

                <input type="hidden" name="id" value="DOC-TEST">

              </form>
            </details>
                      </div></td></tr></tbody></table></section><section><h2>QR status</h2><table class="data-table" style="min-width:0;width:100%;background:white"><tbody><tr><td class="qr-action-cell"><div class="record-action-list">

            <form action="admin-actions.php" method="post" class="table-edit-form">

              <button type="submit" class="btn btn-primary btn-sm">Save</button>
            </form>
          </div></td></tr></tbody></table></section><section><h2>Walk-in payments</h2><table class="data-table" style="min-width:0;width:100%;background:white"><tbody><tr><td class="payment-action-cell">

            </form>
